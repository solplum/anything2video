</style><main><h1>卡牌对抗</h1><p>不是换一张卡面。选牌会支付补给、建立防护或带回物品；对手接触后，规则才结算。数值是原创游戏规则，不代表现实统计。无音轨。</p><div class="row"><label for="variant">故事</label><select id="variant"><option value="lighthouse">最后一盏灯</option><option value="greenhouse">种子守夜</option></select><label><input id="captions" type="checkbox" checked> 显示文字</label><button id="reset">重新选牌</button></div><div id="stage" aria-live="off"></div><div class="row" id="choices" aria-label="选择行动"></div><div id="status" role="status" aria-live="polite"></div><div class="row"><button id="play">播放</button><button id="back">−1 帧</button><button id="next">+1 帧</button><input type="range" id="scrub" min="0" max="479" value="0" aria-label="时间轴"><output id="time">0.00 / 16.00 秒</output></div><small>播放到 4 秒会停下等你选牌。选择后手牌锁定；可重新开始、来回拖动，或在结果处切换另一故事。</small><details><summary>规则账本 / 复用方法</summary><pre id="ledger"></pre><p>样片、交互预览和 Remotion 适配器使用同一套确定性逐帧函数。要复用，编辑 scenarios.mjs 中的目标、补给、威胁和手牌数据。新题材若需要不同物件，扩展原创 cardArt / objectiveArt，而不是把数字换成无来源的“真实效果”。</p></details></main><script>

const SCENARIOS = freeze({
 lighthouse:{id:'lighthouse',name:'最后一盏灯',chapter:'01 / THE LAST LIGHT',goal:'让灯塔撑过这一场风暴',objective:'灯塔',objectiveArt:'lighthouse',maxIntegrity:3,energy:2,threat:{name:'风暴',art:'storm',power:3},theme:{table:'#0a3039',shadow:'#071c28',ink:'#172d37',paper:'#f0e0ba',gold:'#e4ba6c',accent:'#81dbcb',danger:'#ed866f'},choices:[
  {id:'brace',name:'加固',tag:'守住灯火',art:'anchor',cost:2,guard:3,reward:0},
  {id:'rush',name:'赶航',tag:'带回货物',art:'boat',cost:1,guard:0,reward:1}]},
 greenhouse:{id:'greenhouse',name:'种子守夜',chapter:'02 / THE SEED WATCH',goal:'让幼苗撑过这一夜寒潮',objective:'幼苗',objectiveArt:'seedling',maxIntegrity:2,energy:3,threat:{name:'寒潮',art:'frost',power:2},theme:{table:'#343d35',shadow:'#152b2a',ink:'#3f382c',paper:'#f1e5c8',gold:'#d8b777',accent:'#b1d897',danger:'#e28f6d'},choices:[
  {id:'warm',name:'暖房',tag:'护住新芽',art:'greenhouse',cost:2,guard:2,reward:0},

});
const DEFAULT_SCENARIO=SCENARIOS.lighthouse;

/** Pure, random-access, deterministic rules. Every consequence follows a declared event. */

const DUEL={fps:30,durationSeconds:16,frames:480,width:1280,height:720};
const integer=(x,min=0)=>Number.isInteger(x)&&x>=min;
const finite=x=>typeof x==='number'&&Number.isFinite(x);
const fail=message=>{throw new TypeError(message);};
function validateScenario(s){
 if(!s||typeof s!=='object')fail('scenario is required');
 for(const key of ['id','name','chapter','goal','objective','objectiveArt'])if(typeof s[key]!=='string'||!s[key].trim()||s[key].length>100)fail('invalid '+key);

 for(const key of ['maxIntegrity','energy'])if(!integer(s[key],1)||s[key]>6)fail('invalid '+key);
 if(!s.threat||!integer(s.threat.power,1)||s.threat.power>6||!['storm','frost'].includes(s.threat.art)||typeof s.threat.name!=='string'||s.threat.name.length>20)fail('invalid threat');
 if(!s.theme||!['table','shadow','ink','paper','gold','accent','danger'].every(k=>/^#[\da-f]{6}$/i.test(s.theme[k])))fail('invalid theme');
 if(!Array.isArray(s.choices)||s.choices.length<2||s.choices.length>3)fail('choose two or three cards');
 const ids=new Set();
 for(const c of s.choices){
  if(!c||typeof c.id!=='string'||!c.id||ids.has(c.id))fail('invalid or duplicate card id');ids.add(c.id);
  for(const key of ['name','tag'])if(typeof c[key]!=='string'||!c[key]||c[key].length>60)fail('invalid card '+key);
  if([...c.name].length>8||[...c.tag].length>12)fail('card copy too long for this layout');
  if(!['anchor','boat','greenhouse','basket'].includes(c.art))fail('unsupported card art');
  if(!integer(c.cost)||c.cost>s.energy||!integer(c.guard)||c.guard>6||!integer(c.reward)||c.reward>6)fail('invalid cost, guard or reward');
 }
 return s;
}
function duelTiming({fps=30,selectSec=4}={}){
 if(!finite(fps)||fps<1||fps>120)fail('fps must be 1–120');
 if(!finite(selectSec)||selectSec<3||selectSec>5)fail('selection must be 3–5 seconds');
 const frame=t=>Math.round(t*fps);
 return Object.freeze({select:frame(selectSec),commit:frame(selectSec+2),attack:frame(selectSec+5),impact:frame(selectSec+6),settle:frame(selectSec+8),end:Math.ceil(16*fps)-1});
}
function resolveDuel({scenario=DEFAULT_SCENARIO,choice=scenario.choices[0].id}={}){
 validateScenario(scenario);const card=scenario.choices.find(c=>c.id===choice);if(!card)fail('unknown choice');
 const blocked=Math.min(card.guard,scenario.threat.power),damage=scenario.threat.power-blocked;
 return Object.freeze({energy:scenario.energy-card.cost,guard:card.guard-blocked,blocked,damage,integrity:Math.max(0,scenario.maxIntegrity-damage),reward:card.reward});
}
function describeCard(card){
 const effects=[card.guard?`抵挡 ${card.guard} 点冲击`:null,card.reward?`获得 ${card.reward} 份物资`:null].filter(Boolean);
 return `消耗 ${card.cost} 点补给 · ${effects.join(' · ')||'无额外效果'}`;
}
function outcomeCaption(scenario,state){
 if(!state.impacted)return '';
 if(state.integrity>0)return state.damage>0?`承受 ${state.damage} 点损伤，${scenario.objective}仍在。`:state.guard>0?`余下 ${state.guard} 点防护，${scenario.objective}守住。`:`防护耗尽，${scenario.objective}守住。`;
 return state.reward>0?`物资收回，${scenario.objective}失守。`:`防护不足，${scenario.objective}失守。`;
}
function duelEvents({scenario=DEFAULT_SCENARIO,choice=scenario.choices[0].id,fps=30,selectSec=4}={}){
 const final=resolveDuel({scenario,choice}),card=scenario.choices.find(c=>c.id===choice),time=duelTiming({fps,selectSec});
 return Object.freeze([
  Object.freeze({id:'choice',frame:time.select,kind:'decision',card:choice}),
  Object.freeze({id:'commit',frame:time.commit,kind:'payment-and-effect',energyDelta:-card.cost,guardDelta:card.guard,rewardDelta:card.reward}),
  Object.freeze({id:'impact',frame:time.impact,kind:'opposition-resolution',threat:scenario.threat.power,blocked:final.blocked,damage:final.damage,integrityDelta:final.integrity-scenario.maxIntegrity}),
 ]);
}
const engineClamp=x=>Math.max(0,Math.min(1,x));
function duelState({frame,scenario=DEFAULT_SCENARIO,choice=scenario.choices[0].id,fps=30,selectSec=4}={}){
 if(!integer(frame))fail('frame must be a nonnegative integer');
 const final=resolveDuel({scenario,choice}),time=duelTiming({fps,selectSec}),f=Math.min(frame,time.end),card=scenario.choices.find(c=>c.id===choice);
 const chosen=f>=time.select,committed=f>=time.commit,impacted=f>=time.impact;
 const phase=!chosen?'choose':!committed?'commit':f<time.attack?'protect':!impacted?'attack':f<time.settle?'resolve':'result';
 return Object.freeze({frame:f,fps,t:f/fps,time,phase,chosen,committed,impacted,choice:chosen?choice:null,energy:committed?final.energy:scenario.energy,guard:impacted?final.guard:committed?card.guard:0,integrity:impacted?final.integrity:scenario.maxIntegrity,reward:committed?final.reward:0,blocked:impacted?final.blocked:0,damage:impacted?final.damage:0,success:impacted?final.integrity>0:null,cardProgress:engineClamp((f-time.select)/(time.commit-time.select)),attackProgress:engineClamp((f-time.attack)/(time.impact-time.attack)),resolveProgress:engineClamp((f-time.impact)/(time.settle-time.impact))});
}

function renderDuel({frame,scenario=DEFAULT_SCENARIO,choice=scenario.choices[0].id,fps=30,selectSec=4,width=1280,height=720,showCaptions=true}={}){

 if(frame>=time.attack&&frame<time.impact){
  const p=ease(st.attackProgress),x=mix(913,contactX,p),y=349-Math.sin(p*Math.PI)*31;
  parts.push(`<g aria-label="incoming-threat" data-tip-x="${x}" data-contact-x="${contactX}"><path d="M913 348Q840 285 ${x} ${y}" stroke="${c.danger}" stroke-width="3" fill="none" opacity=".5"/><path d="M${x} ${y}l28-15 28 15-28 15Z" fill="${c.danger}"/>${pips({x:x+18,y:y,n:scenario.threat.power,filled:scenario.threat.power,c:c.paper,r:2,gap:9})}</g>`);
 }
 if(impact>0){const radius=(1-impact)*100+18;parts.push(`<g aria-label="impact" data-contact-x="${contactX}" opacity="${impact}"><circle cx="${contactX}" cy="349" r="${radius}" stroke="${protection?c.accent:c.danger}" stroke-width="4" fill="none"/>`);for(let k=0;k<8;k++){const a=k*Math.PI/4,x=contactX;parts.push(line(`M${x+radius*Math.cos(a)} ${349+radius*Math.sin(a)}L${x+(radius+18)*Math.cos(a)} ${349+(radius+18)*Math.sin(a)}`,protection?c.accent:c.danger,3));}parts.push('</g>');}
 if(st.committed&&frame<time.commit+fps*.75){
  const pulse=clamp((frame-time.commit)/(fps*.75));
  parts.push(`<path d="M391 369Q450 345 532 350" fill="none" stroke="${c.gold}" stroke-width="3" stroke-dasharray="${pulse*160} 160" opacity="${1-pulse}"/>`);
 }
 parts.push(`<rect x="116" y="184" width="274" height="363" rx="22" fill="none" stroke="${c.gold}" stroke-width="1" stroke-dasharray="6 8" opacity="${st.committed?.45:.13}"/>`);
 // The selected card is a concrete actor: lift, commit, then settle. No resource is paid on hover.
 parts.push(portraitCard({x:selectedX,y:selectedY,rotate:mix(-8,st.chosen?-2:0,deal)-Math.sin(st.cardProgress*Math.PI)*4,c,name:card.name,tag:card.tag,art:card.art,value:card.cost,kind:'action'}));
 parts.push(portraitCard({x:enemyX,y:enemyY,rotate:mix(9,2,deal)+impact*3,c:{...c,gold:c.danger},name:scenario.threat.name,tag:`冲击强度 ${scenario.threat.power}`,art:scenario.threat.art,value:scenario.threat.power,kind:'opponent'}));
 if(allText&&st.chosen)parts.push(txt(254,580,17,`补给 −${card.cost}  ·  防护 +${card.guard}${card.reward?'  ·  物资 +'+card.reward:''}`,c.paper,'text-anchor="middle" opacity=".8"'));
 if(allText&&!st.chosen)parts.push(txt(255,580,17,scenario.choices.map(v=>v.name).join('  /  '),c.gold,'text-anchor="middle"'));
 if(allText)parts.push(txt(1060,580,17,'预告之后，才会落下',c.paper,'text-anchor="middle" opacity=".62"'));
 // Rules are a projection of engine state; they do not control the outcome.
 if(allText&&st.committed){
  parts.push(txt(640,519,16,st.impacted?`冲击 ${scenario.threat.power} − 抵挡 ${st.blocked} = 损伤 ${st.damage}`:`防护 ${st.guard}  /  目标完好 ${st.integrity}`,st.impacted&&!st.success?c.danger:c.accent,'text-anchor="middle" font-weight="700"'));
  if(st.impacted)parts.push(txt(640,547,13,st.success?'目标守住':'目标失守',st.success?c.accent:c.danger,'text-anchor="middle" letter-spacing="4"'));
 }
 if(allText){parts.push(txt(640,640,25,phaseLabels[st.phase],c.paper,'text-anchor="middle" font-weight="700"'),txt(640,674,12,'选择 → 支付 → 防护 / 收获 → 对手接触 → 规则结算 → 后果',c.gold,'text-anchor="middle" letter-spacing="1"'));}
 parts.push(`<path d="M48 694H${48+1184*Math.min(1,t/16)}" stroke="${c.accent}" stroke-width="2" opacity=".55"/></g></svg>`);
 const svg=parts.join('');
 return showCaptions?svg:svg.replace(/<text\b[^>]*>[\s\S]*?<\/text>/g,'');
}

const ui={stage:document.getElementById('stage'),variant:document.getElementById('variant'),captions:document.getElementById('captions'),choices:document.getElementById('choices'),status:document.getElementById('status'),play:document.getElementById('play'),scrub:document.getElementById('scrub'),time:document.getElementById('time'),ledger:document.getElementById('ledger')};
let frame=0,playing=false,scenario=SCENARIOS.lighthouse,choice=scenario.choices[0].id,locked=false,last=0,remainder=0;
function draw(){ui.stage.innerHTML=renderDuel({frame,scenario,choice,showCaptions:ui.captions.checked});ui.scrub.value=frame;ui.time.textContent=(frame/30).toFixed(2)+' / 16.00 秒';ui.play.textContent=playing?'暂停':'播放';ui.choices.querySelectorAll('button').forEach(b=>{b.disabled=locked;b.setAttribute('aria-pressed',String(locked&&b.dataset.id===choice));});const state=duelState({frame,scenario,choice});ui.status.textContent=locked?(state.impacted?outcomeCaption(scenario,state):'手牌已锁定，支付与结算按时发生。'):'请选择行动。未选牌前，不会扣除补给。';ui.ledger.textContent=JSON.stringify({state:{phase:state.phase,energy:state.energy,guard:state.guard,integrity:state.integrity,reward:state.reward},events:duelEvents({scenario,choice})},null,2);}
function choose(id){if(locked)return;choice=id;locked=true;frame=Math.max(120,frame);playing=true;last=0;draw();}
function reset(){playing=false;locked=false;frame=0;last=0;remainder=0;choice=scenario.choices[0].id;ui.choices.replaceChildren();scenario.choices.forEach(card=>{const b=document.createElement('button');b.dataset.id=card.id;b.textContent=card.name+' · '+describeCard(card);b.onclick=()=>choose(card.id);ui.choices.append(b);});draw();}
function seek(next){playing=false;frame=Math.max(0,Math.min(479,next));if(!locked&&frame>=120)frame=119;draw();}
ui.play.onclick=()=>{if(frame===479){frame=0;playing=true;}else playing=!playing;last=0;draw();};document.getElementById('reset').onclick=reset;document.getElementById('back').onclick=()=>seek(frame-1);document.getElementById('next').onclick=()=>seek(frame+1);ui.scrub.oninput=()=>seek(Number(ui.scrub.value));ui.variant.onchange=()=>{scenario=SCENARIOS[ui.variant.value];reset();};ui.captions.onchange=draw;
document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;last=0;draw();}});
function tick(now){if(playing){if(last){remainder+=(now-last)*.03;const advance=Math.floor(remainder);remainder-=advance;frame=Math.min(479,frame+advance);if(!locked&&frame>=120){frame=119;playing=false;}if(frame===479)playing=false;draw();}last=now;}else last=0;requestAnimationFrame(tick);}reset();requestAnimationFrame(tick);
</script></html>
